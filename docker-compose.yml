# 基础设施默认启动:            docker compose up -d
# 基础设施 + 全部微服务启动:   docker compose --profile apps up -d --build
# (只启动基础设施时, 可以在 IDE 里直接运行各个微服务, 默认连接 localhost)

x-app-env: &app-env
  MYSQL_HOST: mysql
  REDIS_HOST: redis
  RABBIT_HOST: rabbitmq
  NACOS_ADDR: nacos:8848
  JWT_SECRET: ${JWT_SECRET:-ai-smart-mall-dev-secret-key-please-change-me-0123456789}

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # ------------------------------------------------------------ 微服务 (profile: apps)
  gateway:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: gateway } }
    environment: *app-env
    ports:
      - "8080:8080"
    depends_on:
      nacos: { condition: service_healthy }
    restart: on-failure

  user-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: user-service } }
    environment:
      <<: *app-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    restart: on-failure

  product-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: product-service } }
    environment:
      <<: *app-env
      SEED_ENABLED: ${SEED_ENABLED:-true}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }
    restart: on-failure

  trade-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: trade-service } }
    environment:
      <<: *app-env
      ORDER_TIMEOUT_SECONDS: ${ORDER_TIMEOUT_SECONDS:-1800}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }
    restart: on-failure

  ai-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: ai-service } }
    environment:
      <<: *app-env
      MILVUS_HOST: milvus
      AI_API_KEY: ${AI_API_KEY:-missing-api-key}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen-plus}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v3}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-1024}
    depends_on:
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
      nacos: { condition: service_healthy }
    restart: on-failure

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
